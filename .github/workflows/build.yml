name: Build Flet APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.x"
          cache: true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet

      - name: Build APK
        run: |
          flet build apk --release --yes

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: |
            **/*.apk
          if-no-files-found: error
